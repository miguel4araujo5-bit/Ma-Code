name: Temporary setup scroll patch

on:
  push:
    branches:
      - fix/ma-professor-setup-scroll-top

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[setup-scroll-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-setup-scroll-top
          fetch-depth: 0

      - name: Apply setup scroll fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          wizard = 'src/components/ma-professor/setup/SetupWizard.tsx'
          replace_exact(
              wizard,
              """import {\n  type ChangeEvent,\n  useMemo,\n  useState\n} from 'react'\n""",
              """import {\n  type ChangeEvent,\n  useEffect,\n  useMemo,\n  useState\n} from 'react'\n"""
          )

          marker = """  const [guidedPreparationError, setGuidedPreparationError] = useState('')\n\n  const completedSteps = useMemo(\n"""
          replacement = """  const [guidedPreparationError, setGuidedPreparationError] = useState('')\n\n  useEffect(() => {\n    const frameId = window.requestAnimationFrame(() => {\n      window.scrollTo({ top: 0, behavior: 'smooth' })\n    })\n\n    return () => {\n      window.cancelAnimationFrame(frameId)\n    }\n  }, [advancedMode, guidedStage, activeStep])\n\n  const completedSteps = useMemo(\n"""
          replace_exact(wizard, marker, replacement)

          test_file = 'tests/ma-professor/setup-wizard-sequence-coherence.test.mjs'
          p = Path(test_file)
          text = p.read_text(encoding='utf-8')
          addition = """\n\ntest(\n  'setup scrolls to the top after the newly selected screen has rendered',\n  () => {\n    assert.match(\n      wizardSource,\n      /useEffect\\(\\(\\) => \\{[\\s\\S]*requestAnimationFrame[\\s\\S]*window\\.scrollTo\\(\\{ top: 0, behavior: 'smooth' \\}\\)/\n    )\n    assert.match(\n      wizardSource,\n      /\\}, \\[advancedMode, guidedStage, activeStep\\]\\)/\n    )\n  }\n)\n"""
          if addition.strip() in text:
              raise SystemExit('scroll test already present')
          p.write_text(text.rstrip() + addition, encoding='utf-8')
          PY

      - name: Validate targeted setup tests
        shell: bash
        run: |
          git diff --check
          node --test tests/ma-professor/setup-wizard-sequence-coherence.test.mjs

      - name: Commit applied patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ma-professor/setup/SetupWizard.tsx tests/ma-professor/setup-wizard-sequence-coherence.test.mjs
          git commit -m "fix: subir ao topo após mudar etapa do setup [setup-scroll-applied]"
          git push origin HEAD:fix/ma-professor-setup-scroll-top
