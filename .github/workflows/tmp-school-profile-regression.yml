name: Temporary school profile regression fix

on:
  push:
    branches:
      - fix/ma-professor-school-profile-regression

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[school-profile-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-school-profile-regression
          fetch-depth: 0

      - name: Apply regression fix
        run: python3 coordination/agents/tmp_school_profile_fix.py

      - name: Validate targeted tests
        run: node --test tests/ma-professor/schedule-duty-range-confirmation.test.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "MiguelAraujo"
          git config user.email "miguel4araujo5@gmail.com"
          git add src/components/ma-professor/setup/scheduleImportAtomicRepository.ts src/components/ma-professor/calendar/InitialSchoolCalendarBootstrap.tsx tests/ma-professor/schedule-duty-range-confirmation.test.mjs
          git commit -m "fix(ma-professor): recuperar escola ao corrigir horário [school-profile-fixed]"
          git push origin HEAD:fix/ma-professor-school-profile-regression
