name: Fix temporary future patch executor

on:
  push:
    branches:
      - fix/ma-professor-future-actions-permissive

permissions:
  contents: write

jobs:
  fix-executor:
    if: ${{ !contains(github.event.head_commit.message, '[helper-fixed]') && !contains(github.event.head_commit.message, '[future-permissive-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-future-actions-permissive
      - name: Fix replacement handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-future-date-permissive.yml')
          text = path.read_text(encoding='utf-8')
          old = "new_text, actual = re.subn(pattern, replacement, text, count=count, flags=re.S)"
          new = "new_text, actual = re.subn(pattern, lambda _match: replacement, text, count=count, flags=re.S)"
          if text.count(old) != 1:
              raise SystemExit('Não foi encontrada a linha única esperada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-future-date-permissive.yml
          git commit -m "chore: corrigir executor temporário [helper-fixed]"
          git push origin HEAD:fix/ma-professor-future-actions-permissive
