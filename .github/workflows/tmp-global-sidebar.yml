name: Temporary global sidebar patch

on:
  push:
    branches:
      - fix/ma-professor-global-sidebar

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[global-sidebar-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-global-sidebar
          fetch-depth: 0

      - name: Apply global sidebar integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # ProductNavigation is small enough to replace as a complete, reviewed unit.
          Path('src/components/ma-professor/product/ProductNavigation.tsx').write_text(r'''import {
  useEffect,
  useState
} from 'react'

import { useMAProfessorAccess } from '../access/AccessGate'
import { getLicenseStatusLabel } from '../access/accessTypes'

export type ProductWorkspace = 'daily' | 'calendar' | 'backup' | 'menu'
export type ProductTheme = 'light' | 'dark'
export type ProductSidebarDestination =
  | 'dashboard'
  | 'calendar'
  | 'giae'
  | 'assessments'
  | 'planifications'
  | 'groups'
  | 'attendance'
  | 'schedule'
  | 'settings'

interface ProductNavigationProps {
  workspace: ProductWorkspace
  academicYearName: string | null
  theme: ProductTheme
  onSelect: (workspace: ProductWorkspace) => void
  onOpenSidebarDestination: (destination: ProductSidebarDestination) => void
  onToggleTheme: () => void
}

const items: Array<{
  id: ProductWorkspace
  label: string
  icon: string
}> = [
  {
    id: 'daily',
    label: 'Hoje',
    icon: '▤'
  },
  {
    id: 'calendar',
    label: 'Calendário',
    icon: '▦'
  },
  {
    id: 'backup',
    label: 'Cópia',
    icon: '⇩'
  },
  {
    id: 'menu',
    label: 'Menu',
    icon: '☰'
  }
]

const sidebarItems: Array<{
  id: ProductSidebarDestination
  label: string
}> = [
  { id: 'dashboard', label: 'Painel' },
  { id: 'calendar', label: 'Calendário' },
  { id: 'giae', label: 'Sumários / GIAE' },
  { id: 'assessments', label: 'Avaliações' },
  { id: 'planifications', label: 'Planificações' },
  { id: 'groups', label: 'Turmas e alunos' },
  { id: 'attendance', label: 'Faltas e recuperações' },
  { id: 'schedule', label: 'Horários' },
  { id: 'settings', label: 'Definições' }
]

export function ProductNavigation({
  workspace,
  academicYearName,
  theme,
  onSelect,
  onOpenSidebarDestination,
  onToggleTheme
}: ProductNavigationProps) {
  const { session } = useMAProfessorAccess()
  const [sidebarOpen, setSidebarOpen] = useState(false)

  const nextThemeLabel =
    theme === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro'

  useEffect(() => {
    if (!sidebarOpen) {
      return
    }

    const handleKeyDown = (event: KeyboardEvent) => {
      if (event.key === 'Escape') {
        setSidebarOpen(false)
      }
    }

    window.addEventListener('keydown', handleKeyDown)

    return () => {
      window.removeEventListener('keydown', handleKeyDown)
    }
  }, [sidebarOpen])

  function openDestination(destination: ProductSidebarDestination) {
    setSidebarOpen(false)
    onOpenSidebarDestination(destination)
  }

  return (
    <>
      <header className="sticky top-0 z-[70] border-b border-white/10 bg-slate-950/95 text-white shadow-xl shadow-black/20 backdrop-blur-xl">
