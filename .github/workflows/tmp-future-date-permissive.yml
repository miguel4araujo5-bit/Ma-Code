name: Temporary future-date permissive patch

on:
  push:
    branches:
      - fix/ma-professor-future-actions-permissive

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[future-permissive-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-future-actions-permissive
          fetch-depth: 0

      - name: Apply exact source and test changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          def replace_regex(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new_text, actual = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} regex match(es), found {actual}')
              p.write_text(new_text, encoding='utf-8')

          temporal = 'src/components/ma-professor/lessons/lessonTemporalSafety.ts'
          replace_regex(
              temporal,
              r"export function resolveLessonStatusForDate\([\s\S]*?\n}\n\nexport function assertLessonNotTaughtInFuture\([\s\S]*?\n}\n$",
              """export function resolveLessonStatusForDate(\n  _lessonDate: ISODate,\n  status: LessonStatus,\n  _referenceDate: ISODate =\n    todayISO()\n): LessonStatus {\n  return status\n}\n\nexport function assertLessonNotTaughtInFuture(\n  _lessonDate: ISODate,\n  _status: LessonStatus,\n  _referenceDate: ISODate =\n    todayISO()\n) {\n  return\n}\n"""
          )

          daily = 'src/components/ma-professor/daily/dailyWorkspaceRepository.ts'
          replace_exact(
              daily,
              """import {\n  isFutureLessonDate,\n  resolveLessonStatusForDate\n} from '../lessons/lessonTemporalSafety'\n""",
              """import {\n  resolveLessonStatusForDate\n} from '../lessons/lessonTemporalSafety'\n"""
          )
          replace_regex(
              daily,
              r"\nfunction hasFutureAttendanceInput\([\s\S]*?\n}\n\nfunction fingerprintRecords",
              "\nfunction fingerprintRecords"
          )
          replace_exact(
              daily,
              """    const futurePreparation =\n      isFutureLessonDate(\n        loadedLesson.date\n      )\n\n""",
              ""
          )
          replace_exact(
              daily,
              """    if (\n      futurePreparation &&\n      input.giaeStatus ===\n        'submitted'\n    ) {\n      throw new Error(\n        'Uma aula futura não pode ser marcada como submetida no GIAE. Guarde apenas a preparação da aula.'\n      )\n    }\n\n    if (\n      futurePreparation &&\n      hasFutureAttendanceInput(\n        input\n      )\n    ) {\n      throw new Error(\n        'Uma aula futura ainda não pode receber faltas. Pode registar a avaliação, o sumário, a atividade e a planificação.'\n      )\n    }\n\n""",
              ""
          )

          harness = 'tests/ma-professor/daily-workflow-harness.mjs'
          replace_exact(
              harness,
              "  export function resolveLessonStatusForDate(_date,status){return isFutureLessonDate()&&status==='taught'?'planned':status}\n",
              "  export function resolveLessonStatusForDate(_date,status){return status}\n"
          )

          workflow_test = 'tests/ma-professor/daily-pedagogical-workflow.test.mjs'
          replace_regex(
              workflow_test,
              r"(test\(\n  'future planned lesson can persist assessment results without attendance or GIAE side effects',[\s\S]*?lessonDraft\(\{\n          summary: '',\n          status:) 'taught'",
              r"\1 'planned'"
          )
          replace_regex(
              workflow_test,
              r"test\(\n  'future attendance remains blocked while future assessment is allowed',[\s\S]*?\n  }\n\)\n\n(?=test\(\n  'cancelled lesson remains protected)",
              """test(\n  'future lesson can persist attendance after the professor chooses to edit the future date',\n  { concurrency: false },\n  async () => {\n    const state =\n      resetDailyState()\n    state.futureLesson = true\n\n    const repository =\n      new DailyWorkspaceRepository()\n\n    await loadLesson(repository)\n\n    await repository.saveLesson(\n      lessonDraft({\n        summary:\n          'Sumário preparado antecipadamente.',\n        status: 'taught',\n        students:\n          studentDrafts({\n            brunoAbsent: true\n          })\n      })\n    )\n\n    assert.equal(\n      state.lesson.status,\n      'taught'\n    )\n    assert.equal(\n      state.attendance['student-2'].status,\n      'absent'\n    )\n    assert.equal(\n      state.attendance['student-2'].code,\n      'F'\n    )\n  }\n)\n\n"""
          )

          safety_test = 'tests/ma-professor/future-lesson-temporal-safety.test.mjs'
          replace_exact(
              safety_test,
              "  'future preparation stays planned while today past and cancellation keep their normal status',",
              "  'future dates preserve the lesson status selected by the professor',"
          )
          replace_exact(
              safety_test,
              """    assert.equal(\n      resolveLessonStatusForDate(\n        '2026-09-07',\n        'taught',\n        referenceDate\n      ),\n      'planned'\n    )\n""",
              """    assert.equal(\n      resolveLessonStatusForDate(\n        '2026-09-07',\n        'taught',\n        referenceDate\n      ),\n      'taught'\n    )\n"""
          )
          replace_exact(
              safety_test,
              "  'explicit future GIAE/taught guard still rejects invalid submitted-state paths',",
              "  'future dates no longer reject a taught status',"
          )
          replace_regex(
              safety_test,
              r"    assert\.throws\(\n      \(\) =>\n        assertLessonNotTaughtInFuture\(\n          '2026-09-07',\n          'taught',\n          '2026-09-06'\n        \),\n      /aula futura não pode ser marcada como dada/i\n    \)",
              """    assert.doesNotThrow(() =>\n      assertLessonNotTaughtInFuture(\n        '2026-09-07',\n        'taught',\n        '2026-09-06'\n      )\n    )"""
          )
          replace_exact(
              safety_test,
              "  'lesson repository normalizes future taught writes and guards GIAE individual and bulk submission',",
              "  'lesson repository keeps temporal helpers while future-date policy is permissive',"
          )
          replace_regex(
              safety_test,
              r"test\(\n  'Daily future preparation keeps GIAE and attendance blocked but no longer blocks assessment',[\s\S]*?\n  }\n\)\n\n(?=test\(\n  'Daily persists attendance only for taught lessons)",
              """test(\n  'Daily does not add future-date blocks for GIAE attendance or assessment',\n  () => {\n    const saveStart =\n      dailyRepositorySource.indexOf(\n        'async saveLesson('\n      )\n    const describeStart =\n      dailyRepositorySource.indexOf(\n        'describeError(',\n        saveStart\n      )\n    const saveBody =\n      dailyRepositorySource.slice(\n        saveStart,\n        describeStart\n      )\n\n    assert.match(\n      saveBody,\n      /const effectiveStatus =[\\s\\S]*resolveLessonStatusForDate\\(/s\n    )\n    assert.doesNotMatch(\n      saveBody,\n      /aula futura não pode ser marcada como submetida no GIAE/i\n    )\n    assert.doesNotMatch(\n      saveBody,\n      /aula futura ainda não pode receber faltas/i\n    )\n    assert.doesNotMatch(\n      saveBody,\n      /hasFutureAttendanceInput/\n    )\n    assert.match(\n      saveBody,\n      /status:\\s*currentEffectiveStatus/s\n    )\n  }\n)\n\n"""
          )

          PY

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          git diff -- src/components/ma-professor/lessons/lessonTemporalSafety.ts src/components/ma-professor/daily/dailyWorkspaceRepository.ts tests/ma-professor/daily-workflow-harness.mjs tests/ma-professor/daily-pedagogical-workflow.test.mjs tests/ma-professor/future-lesson-temporal-safety.test.mjs

      - name: Commit applied patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ma-professor/lessons/lessonTemporalSafety.ts src/components/ma-professor/daily/dailyWorkspaceRepository.ts tests/ma-professor/daily-workflow-harness.mjs tests/ma-professor/daily-pedagogical-workflow.test.mjs tests/ma-professor/future-lesson-temporal-safety.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: permitir ações pedagógicas em datas futuras [future-permissive-applied]"
          git push origin HEAD:fix/ma-professor-future-actions-permissive
