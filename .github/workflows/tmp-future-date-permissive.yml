name: Temporary future-date permissive patch

on:
  push:
    branches:
      - fix/ma-professor-future-actions-permissive

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[future-permissive-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-future-actions-permissive
          fetch-depth: 0

      - name: Apply source and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = 'src/components/ma-professor/lessons/lessonTemporalSafety.ts'
          text = read(path)
          start = text.index('export function resolveLessonStatusForDate(')
          text = text[:start] + '''export function resolveLessonStatusForDate(
  _lessonDate: ISODate,
  status: LessonStatus,
  _referenceDate: ISODate =
    todayISO()
): LessonStatus {
  return status
}

export function assertLessonNotTaughtInFuture(
  _lessonDate: ISODate,
  _status: LessonStatus,
  _referenceDate: ISODate =
    todayISO()
) {
  return
}
'''
          write(path, text)

          path = 'src/components/ma-professor/daily/dailyWorkspaceRepository.ts'
          text = read(path)
          text = once(text, "import {\n  isFutureLessonDate,\n  resolveLessonStatusForDate\n} from '../lessons/lessonTemporalSafety'\n", "import {\n  resolveLessonStatusForDate\n} from '../lessons/lessonTemporalSafety'\n", 'daily temporal import')
          start = text.index('\nfunction hasFutureAttendanceInput(')
          end = text.index('\nfunction fingerprintRecords', start)
          text = text[:start] + text[end:]
          text = once(text, "    const futurePreparation =\n      isFutureLessonDate(\n        loadedLesson.date\n      )\n\n", '', 'futurePreparation declaration')
          start = text.index("    if (\n      futurePreparation &&\n      input.giaeStatus ===")
          end = text.index("    if (\n      effectiveStatus ===", start)
          text = text[:start] + text[end:]
          write(path, text)

          path = 'tests/ma-professor/daily-workflow-harness.mjs'
          text = read(path)
          text = once(text, "  export function resolveLessonStatusForDate(_date,status){return isFutureLessonDate()&&status==='taught'?'planned':status}\n", "  export function resolveLessonStatusForDate(_date,status){return status}\n", 'daily harness temporal policy')
          write(path, text)

          path = 'tests/ma-professor/daily-pedagogical-workflow.test.mjs'
          text = read(path)
          start = text.index("test(\n  'future planned lesson can persist assessment results without attendance or GIAE side effects',")
          end = text.index("test(\n  'planned lesson on a non-future date", start)
          section = text[start:end]
          section = once(section, "          status: 'taught',", "          status: 'planned',", 'future assessment status')
          text = text[:start] + section + text[end:]
          start = text.index("test(\n  'future attendance remains blocked while future assessment is allowed',")
          end = text.index("test(\n  'cancelled lesson remains protected", start)
          block = '''test(
  'future lesson can persist attendance after the professor chooses to edit the future date',
  { concurrency: false },
  async () => {
    const state = resetDailyState()
    state.futureLesson = true
    const repository = new DailyWorkspaceRepository()
    await loadLesson(repository)
    await repository.saveLesson(
      lessonDraft({
        summary: 'Sumário preparado antecipadamente.',
        status: 'taught',
        students: studentDrafts({ brunoAbsent: true })
      })
    )
    assert.equal(state.lesson.status, 'taught')
    assert.equal(state.attendance['student-2'].status, 'absent')
    assert.equal(state.attendance['student-2'].code, 'F')
  }
)

'''
          text = text[:start] + block + text[end:]
          write(path, text)

          path = 'tests/ma-professor/future-lesson-temporal-safety.test.mjs'
          text = read(path)
          text = once(text, "  'future preparation stays planned while today past and cancellation keep their normal status',", "  'future dates preserve the lesson status selected by the professor',", 'temporal title')
          text = once(text, "      'planned'\n    )", "      'taught'\n    )", 'future status expectation')
          text = once(text, "  'explicit future GIAE/taught guard still rejects invalid submitted-state paths',", "  'future dates no longer reject a taught status',", 'future guard title')
          start = text.index("    assert.throws(\n      () =>\n        assertLessonNotTaughtInFuture(")
          end = text.index("\n\n    assert.doesNotThrow", start)
          replacement = '''    assert.doesNotThrow(() =>
      assertLessonNotTaughtInFuture(
        '2026-09-07',
        'taught',
        '2026-09-06'
      )
    )'''
          text = text[:start] + replacement + text[end:]
          text = once(text, "  'lesson repository normalizes future taught writes and guards GIAE individual and bulk submission',", "  'lesson repository keeps temporal helpers while future-date policy is permissive',", 'repository title')
          start = text.index("test(\n  'Daily future preparation keeps GIAE and attendance blocked but no longer blocks assessment',")
          end = text.index("test(\n  'Daily persists attendance only for taught lessons", start)
          block = '''test(
  'Daily does not add future-date blocks for GIAE attendance or assessment',
  () => {
    const saveStart = dailyRepositorySource.indexOf('async saveLesson(')
    const describeStart = dailyRepositorySource.indexOf('describeError(', saveStart)
    const saveBody = dailyRepositorySource.slice(saveStart, describeStart)
    assert.match(saveBody, /const effectiveStatus =[\s\S]*resolveLessonStatusForDate\(/s)
    assert.doesNotMatch(saveBody, /aula futura não pode ser marcada como submetida no GIAE/i)
    assert.doesNotMatch(saveBody, /aula futura ainda não pode receber faltas/i)
    assert.doesNotMatch(saveBody, /hasFutureAttendanceInput/)
    assert.match(saveBody, /status:\s*currentEffectiveStatus/s)
  }
)

'''
          text = text[:start] + block + text[end:]
          write(path, text)
          PY

      - name: Validate patch shape
        run: |
          git diff --check
          git diff --stat

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ma-professor/lessons/lessonTemporalSafety.ts src/components/ma-professor/daily/dailyWorkspaceRepository.ts tests/ma-professor/daily-workflow-harness.mjs tests/ma-professor/daily-pedagogical-workflow.test.mjs tests/ma-professor/future-lesson-temporal-safety.test.mjs
          git commit -m "fix: permitir ações pedagógicas em datas futuras [future-permissive-applied]"
          git push origin HEAD:fix/ma-professor-future-actions-permissive
