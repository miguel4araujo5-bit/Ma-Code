name: Diagnose MA-Professor

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: diagnose-ma-professor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture exact MA-Professor failures
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run failing tests with JUnit report
        id: failing_tests
        continue-on-error: true
        run: >-
          node --test
          --test-reporter=junit
          --test-reporter-destination=ma-professor-failures.xml
          tests/ma-professor/daily-giae-auto.test.mjs
          tests/ma-professor/daily-quick-grade.test.mjs
          tests/ma-professor/giae-concurrency-safety.test.mjs
          tests/ma-professor/giae-copy-does-not-submit.test.mjs
          tests/ma-professor/schedule-pdf-duty-completeness.test.mjs

      - name: Upload exact failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-professor-failures
          path: ma-professor-failures.xml
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failing status
        if: steps.failing_tests.outcome == 'failure'
        run: exit 1
