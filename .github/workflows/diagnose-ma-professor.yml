name: Diagnose MA-Professor

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: diagnose-ma-professor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture Quick Grade and concurrency errors
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture Quick Grade log
        continue-on-error: true
        run: node --test tests/ma-professor/daily-quick-grade.test.mjs > daily-quick-grade.log 2>&1

      - name: Capture GIAE concurrency log
        continue-on-error: true
        run: node --test tests/ma-professor/giae-concurrency-safety.test.mjs > giae-concurrency-safety.log 2>&1

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-professor-load-errors
          path: |
            daily-quick-grade.log
            giae-concurrency-safety.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic failure
        run: exit 1
