name: Publish frozen OPAQUE runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/opaque-vendor-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout MA-CODE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rust/Wasm toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Build pinned OPAQUE runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/serenity-kit/opaque.git /tmp/opaque-src
          cd /tmp/opaque-src
          git checkout c89f6f5853b806dff1a681a7fb447316603b18d8
          test "$(git rev-parse HEAD)" = "c89f6f5853b806dff1a681a7fb447316603b18d8"
          cargo build --target wasm32-unknown-unknown --release
          mkdir -p "$GITHUB_WORKSPACE/.opaque-publish"
          wasm-bindgen \
            --out-dir "$GITHUB_WORKSPACE/.opaque-publish" \
            --target web \
            --omit-default-module-path \
            target/wasm32-unknown-unknown/release/opaque.wasm

      - name: Verify validated hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "b0ea9694032d222c23dd39b24fbd43debf544aae26a989d63ad2285bc71e8ce8  .opaque-publish/opaque.js" | sha256sum --check --strict
          echo "e124dc83250f9fd2b9a62377a6967d1b02da20d03150b816305a89fa1fe2f2d4  .opaque-publish/opaque_bg.wasm" | sha256sum --check --strict

      - name: Materialize frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="worker/vendor/ma-professor-opaque"
          rm -rf "$VENDOR"
          mkdir -p "$VENDOR"

          cp .opaque-publish/opaque.js "$VENDOR/opaque.js"
          cp .opaque-publish/opaque.d.ts "$VENDOR/opaque.d.ts"
          cp .opaque-publish/opaque_bg.wasm "$VENDOR/opaque_bg.wasm"
          cp .opaque-publish/opaque_bg.wasm.d.ts "$VENDOR/opaque_bg.wasm.d.ts"
          cp /tmp/opaque-src/LICENSE "$VENDOR/LICENSE"
          cp /tmp/opaque-src/Cargo.lock "$VENDOR/UPSTREAM_CARGO_LOCK"

          cat > "$VENDOR/SOURCE.md" <<'EOF'
          # MA-Professor OPAQUE runtime provenance

          - Upstream: serenity-kit/opaque
          - Upstream commit: c89f6f5853b806dff1a681a7fb447316603b18d8
          - Protocol core: opaque-ke (resolved exactly in UPSTREAM_CARGO_LOCK)
          - wasm-bindgen CLI: wasm-bindgen 0.2.128
          - opaque.js SHA-256: b0ea9694032d222c23dd39b24fbd43debf544aae26a989d63ad2285bc71e8ce8
          - opaque_bg.wasm SHA-256: e124dc83250f9fd2b9a62377a6967d1b02da20d03150b816305a89fa1fe2f2d4
          - License: MIT (see LICENSE)

          Estes ficheiros foram recompilados a partir do commit upstream fixado
          e só são publicados se os hashes coincidirem exatamente com o runtime
          que passou o round-trip OPAQUE no workerd.

          Não regenerar ou substituir sem repetir os gates de compatibilidade,
          protocolo e regressão.
          EOF

      - name: Commit frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/vendor/ma-professor-opaque

          if git diff --cached --quiet; then
            echo "Runtime already materialized."
            exit 0
          fi

          git commit -m "chore: fixar runtime OPAQUE validado"
          git push origin HEAD:main
