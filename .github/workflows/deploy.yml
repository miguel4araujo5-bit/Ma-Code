name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ma-code-build-check
  cancel-in-progress: true

jobs:
  build:
    name: Validate build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install disposable IndexedDB test adapter
        run: npm install --no-save --package-lock=false fake-indexeddb@6.2.4

      - name: Run independent Dexie IndexedDB rollback proof
        run: node --test tests/validation/agent5-dexie-indexeddb-rollback.test.mjs

      - name: Run Agent 5 backup-integrity test specifically
        id: agent5_specific
        continue-on-error: true
        run: node --test tests/ma-professor/backup-integrity.test.mjs

      - name: Run MA-Professor full suite
        id: ma_professor_suite
        continue-on-error: true
        run: node --test tests/ma-professor/*.test.mjs

      - name: Build project
        run: npm run build

      - name: Report validation failure if Agent 5 tests failed
        if: steps.agent5_specific.outcome != 'success' || steps.ma_professor_suite.outcome != 'success'
        run: |
          echo 'Agent 5 validation tests failed; see previous steps.'
          exit 1
