name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Conquistador tests
        run: npm run test:conquistador

      - name: Run MA-Professor tests
        run: node --test tests/ma-professor/*.test.mjs

      - name: Run MA-Quadro tests
        run: npm run test:ma-quadro

      - name: Build project
        run: npm run build
