name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ma-code-build-check
  cancel-in-progress: true

jobs:
  build:
    name: Validate build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Validate Cloudflare Worker
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config wrangler.jsonc
