name: Temporary professional start fix

on:
  push:
    branches:
      - fix/ma-professor-professional-start-14-sep

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[professional-start-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ma-professor-professional-start-14-sep
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fix
        run: python3 coordination/agents/tmp_professional_start_fix.py

      - name: Validate targeted tests
        run: node --test tests/ma-professor/regular-school-calendar-preset.test.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "MiguelAraujo"
          git config user.email "miguel4araujo5@gmail.com"
          git add src/components/ma-professor/calendar/initialSchoolCalendar2026_2027.ts tests/ma-professor/regular-school-calendar-preset.test.mjs
          git commit -m "fix(ma-professor): iniciar profissional a 14 setembro [professional-start-fixed]"
          git push origin HEAD:fix/ma-professor-professional-start-14-sep
